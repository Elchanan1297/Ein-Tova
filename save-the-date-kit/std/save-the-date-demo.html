<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Save the date — demo</title>
<style>
@font-face{font-family:'Frank Ruhl Libre';src:url(assets/frank.ttf);font-weight:300 900}
@font-face{font-family:Assistant;src:url(assets/assistant.ttf);font-weight:200 800}
:root{--navy:#1E2235;--navy2:#2F3659;--gold:#D9B66F;--gold2:#BE9550;--gold3:#9A7634;--cream:#F8F3EA}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14172A}
.std{position:relative;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));color:var(--cream);font-family:Assistant,sans-serif;
  background:radial-gradient(120% 60% at 80% 0%,var(--navy2) 0%,rgba(47,54,89,0) 60%),radial-gradient(90% 40% at 10% 100%,rgba(190,149,80,.18),transparent 70%),linear-gradient(180deg,#1E2235,#14172A)}
.arcs{position:absolute;inset:auto 0 12% 0;width:100%;opacity:.5;pointer-events:none}
.arcs path{fill:none;stroke:var(--gold);stroke-opacity:.3;stroke-width:.8}
.logo{width:116px;margin-top:4px;opacity:0;animation:rise .8s .05s cubic-bezier(.34,1.5,.5,1) forwards}
/* תמונה בקשת */
.arch{position:relative;width:176px;height:204px;margin-top:8px;border-radius:88px 88px 14px 14px;overflow:hidden;
  background:linear-gradient(180deg,#2F3659 0%,#3B4A6B 55%,#C99A5C 120%);box-shadow:0 0 0 1.5px rgba(217,182,111,.9),0 0 0 6px rgba(217,182,111,.18),0 18px 50px rgba(0,0,0,.45),0 0 60px rgba(217,182,111,.18);
  opacity:0;animation:rise .9s .2s cubic-bezier(.34,1.5,.5,1) forwards}
.arch img{position:absolute;left:50%;bottom:0;height:112%;transform:translateX(-50%)}
.arch:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);background-size:260% 100%;animation:sheen 5s 1.2s ease-in-out infinite}
.eyebrow{margin-top:16px;font:600 12px Assistant;letter-spacing:.42em;color:var(--gold);opacity:.9}
h1{margin:2px 0 0;font:900 46px/1.02 'Frank Ruhl Libre',serif;direction:ltr;text-transform:uppercase;letter-spacing:.02em;
  background:linear-gradient(180deg,#F6DFA0,#D9B66F 55%,#B08A48);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;animation:rise .9s .35s cubic-bezier(.34,1.5,.5,1) forwards;text-align:center}
.date{margin-top:10px;text-align:center;opacity:0;animation:rise .9s .5s cubic-bezier(.34,1.5,.5,1) forwards}
.date b{display:block;font:700 26px 'Frank Ruhl Libre',serif;color:var(--cream)}
.date span{display:block;margin-top:2px;font:400 16px Assistant;color:rgba(248,243,234,.78)}
.date .time{margin-top:6px;font-weight:600;color:var(--gold)}
/* שעון חול */
.hg{margin-top:14px;width:84px;height:132px;filter:drop-shadow(0 0 14px rgba(217,182,111,.35));opacity:0;animation:rise .9s .65s cubic-bezier(.34,1.5,.5,1) forwards}
.hg svg{width:100%;height:100%;overflow:visible;transform-origin:50% 50%;animation:flip 9s infinite}
.top{transform-origin:60px 95px;animation:topsand 9s infinite linear}
.bot{transform-origin:60px 166px;animation:botsand 9s infinite linear}
.stream{stroke-dasharray:4 5;animation:fall 9s infinite linear,dash .5s infinite linear}
@keyframes topsand{0%,4%{transform:scaleY(1)}72%,100%{transform:scaleY(0)}}
@keyframes botsand{0%,4%{transform:scaleY(0)}72%,100%{transform:scaleY(1)}}
@keyframes fall{0%,3%{opacity:0}6%,70%{opacity:1}73%,100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-9}}
@keyframes flip{0%,78%{transform:rotate(0)}92%,100%{transform:rotate(180deg)}}
.count{margin-top:12px;display:flex;gap:10px;direction:rtl;opacity:0;animation:rise .9s .8s cubic-bezier(.34,1.5,.5,1) forwards}
.count div{min-width:58px;padding:8px 6px 6px;text-align:center;border-radius:16px;background:rgba(255,255,255,.06);
  border:1px solid rgba(217,182,111,.28);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.count b{display:block;font:800 22px 'Frank Ruhl Libre',serif;color:var(--cream);font-variant-numeric:tabular-nums}
.count i{display:block;font:normal 11px Assistant;color:var(--gold);margin-top:1px}
.foot{margin-top:auto;padding-top:14px;font:500 12px Assistant;letter-spacing:.08em;color:rgba(248,243,234,.55)}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0;animation:spark 4s infinite}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.9}100%{opacity:0;transform:translateY(-60px) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheen{0%,20%{background-position:130% 0}60%,100%{background-position:-30% 0}}
@media (max-height:700px){.arch{width:150px;height:174px;border-radius:75px 75px 12px 12px}.hg{width:64px;height:100px}h1{font-size:38px}.logo{width:90px}}
@media (prefers-reduced-motion:reduce){.hg svg,.top,.bot,.stream,.arch:after,.spark{animation:none}.top{transform:scaleY(.5)}.bot{transform:scaleY(.5)}.stream{opacity:0}*{animation-duration:.01s!important}}
</style>
<div class="std" role="main" aria-label="שמרו את התאריך">
<svg class="arcs" viewBox="0 0 390 200" preserveAspectRatio="none"><path d="M-10,120 C80,80 160,150 230,110 S350,70 400,100"/><path d="M-10,132 C84,92 164,162 234,122 S352,82 400,112"/><path d="M-10,108 C76,68 156,138 226,98 S348,58 400,88"/></svg>
<img class="logo" src="assets/logo-dark.svg" alt="עין טובה">
<div class="arch"><img src="assets/father-bust.png" alt="אבא"></div>
<div class="eyebrow">70 · עין טובה</div>
<h1 id="headline">Save the date</h1>
<div class="date"><b id="d1">…</b><span id="d2"></span><span class="time" id="d3"></span></div>
<div class="hg" aria-hidden="true">
<svg viewBox="0 0 120 190"><defs>
<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DFA0"/><stop offset=".55" stop-color="#D9B66F"/><stop offset="1" stop-color="#B08A48"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/></linearGradient>
<clipPath id="glass"><path id="gp" d="M26 26H94C94 62 72 80 66 95C72 110 94 128 94 164H26C26 128 48 110 54 95C48 80 26 62 26 26Z"/></clipPath></defs>
<path d="M26 26H94C94 62 72 80 66 95C72 110 94 128 94 164H26C26 128 48 110 54 95C48 80 26 62 26 26Z" fill="url(#gl)"/>
<g clip-path="url(#glass)"><rect class="top" x="20" y="28" width="80" height="67" fill="url(#g)"/><rect class="bot" x="20" y="96" width="80" height="70" fill="url(#g)"/>
<line class="stream" x1="60" y1="92" x2="60" y2="166" stroke="#F6DFA0" stroke-width="2.2" stroke-linecap="round"/></g>
<path d="M26 26H94C94 62 72 80 66 95C72 110 94 128 94 164H26C26 128 48 110 54 95C48 80 26 62 26 26Z" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round"/>
<path d="M33 34C34 58 46 72 52 82" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
<rect x="14" y="12" width="92" height="14" rx="7" fill="url(#g)"/><rect x="14" y="164" width="92" height="14" rx="7" fill="url(#g)"/></svg></div>
<div class="count" id="count"></div>
<div class="foot">נתראה בקרוב</div>
<i class="spark" style="left:18%;top:62%;animation-delay:.3s"></i><i class="spark" style="left:80%;top:68%;animation-delay:1.4s"></i><i class="spark" style="left:30%;top:80%;animation-delay:2.2s"></i><i class="spark" style="left:70%;top:54%;animation-delay:3s"></i>
</div>
<script>
/* דוגמה: בייצור הערכים מגיעים מ-GET /api/config → saveTheDate */
const cfg={eventAt:'2027-01-14T19:00:00+02:00',display:'both',headline:'Save the date',hebrewOverride:'',showCountdown:true};
const d=new Date(cfg.eventAt);const tz='Asia/Jerusalem';
const f=(o,l)=>new Intl.DateTimeFormat(l,{timeZone:tz,...o}).format(d);
const greg=f({weekday:'long',day:'numeric',month:'long',year:'numeric'},'he-IL');
/* גימטריה: בייצור מומלץ @hebcal/core (renderGematriya). כאן מימוש קטן להדגמה */
function gem(n){const L=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
 if(n===15)return 'ט״ו';if(n===16)return 'ט״ז';let r='';for(const[v,c]of L){while(n>=v){r+=c;n-=v}}
 return r.length>1?r.slice(0,-1)+'״'+r.slice(-1):r+'׳'}
const hp=Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-hebrew',{timeZone:tz,day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d).map(x=>[x.type,x.value]));
const hm=new Intl.DateTimeFormat('he-u-ca-hebrew',{timeZone:tz,month:'long'}).format(d);
const heb=cfg.hebrewOverride||`${gem(+hp.day)} ב${hm} ${gem(+hp.year%1000)}`;
document.getElementById('headline').textContent=cfg.headline;
document.getElementById('d1').textContent=cfg.display==='gregorian'?greg:heb;
document.getElementById('d2').textContent=cfg.display==='both'?greg:'';
document.getElementById('d3').textContent='בשעה '+f({hour:'2-digit',minute:'2-digit',hour12:false},'he-IL');
const c=document.getElementById('count');
function tick(){const ms=Math.max(0,d-Date.now());const s=Math.floor(ms/1000);
 const v=[[Math.floor(s/86400),'ימים'],[Math.floor(s/3600)%24,'שעות'],[Math.floor(s/60)%60,'דקות'],[s%60,'שניות']];
 c.innerHTML=v.map(([n,l])=>`<div><b>${String(n).padStart(2,'0')}</b><i>${l}</i></div>`).join('');}
if(cfg.showCountdown){tick();setInterval(tick,1000)}else c.remove();
</script></html>
